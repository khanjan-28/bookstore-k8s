version: "3.9"

services:

  mysql:

    image: mysql:8

    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bookstore

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - bookstore-network

  backend:

    build: ./backend

    container_name: bookstore-backend

    restart: always

    depends_on:
      - mysql

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: bookstore

    volumes:
      - ./backend/uploads:/app/uploads

    networks:
      - bookstore-network

  frontend:

    build: ./frontend

    container_name: bookstore-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - bookstore-network

networks:

  bookstore-network:

volumes:

  mysql-data:

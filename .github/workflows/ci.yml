name: Bookstore CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  docker-build-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Frontend Image
      run: |
        docker build -t khanjanprojects/bookstore-frontend:latest ./frontend


    - name: Build Backend Image
      run: |
        docker build -t khanjanprojects/bookstore-backend:latest ./backend


    - name: Push Frontend Image
      run: |
        docker push khanjanprojects/bookstore-frontend:latest


    - name: Push Backend Image
      run: |
        docker push khanjanprojects/bookstore-backend:latest